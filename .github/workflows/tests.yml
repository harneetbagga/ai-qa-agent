# Runs the committed test suite on every push and pull request.
# It never runs the AI agent and needs no API key: the agent runs on your machine,
# and only tests you approved (committed on an ai-agent/... branch, merged by PR) get here.
name: tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install the browser
        run: playwright install --with-deps chromium

      - name: Run the tests
        run: >
          pytest tests
          --browser chromium
          --junitxml=results.xml
          --tracing=retain-on-failure
          --screenshot=only-on-failure

      - name: Upload results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.xml
            test-results/
          if-no-files-found: ignore
